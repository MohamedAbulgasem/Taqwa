<!doctype html>
<html lang="{lang}" dir="{dir}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <meta name="description" content="{description}">
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0D0C" media="(prefers-color-scheme: dark)">
{app_banner}{robots}  <meta property="og:site_name" content="Taqwa">
  <meta property="og:title" content="{og_title}">
  <meta property="og:description" content="{description}">
  <meta property="og:url" content="{canonical}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{og_locale}">
  <meta property="og:image" content="{og_image}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{og_title}">
  <meta name="twitter:card" content="summary_large_image">
{link_tags}
  <link rel="icon" href="{root}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{root}assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{root}assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="{root}assets/style.css?v={style_version}">
{structured_data}</head>
<body>
<header class="wrap top">
  <a class="brand" href="{home}" aria-label="{brand_label}">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.56 12.6V8.13c0-2.32 1.38-3.94 3.44-4.75 2.06.81 3.44 2.43 3.44 4.75v4.47" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="6.3" r="0.95" fill="currentColor"/></svg>
    Taqwa
  </a>
  <nav class="nav" aria-label="{nav_label}">
    {prayer_times_nav}<a class="wide" href="{privacy}"{privacy_current}>{nav_privacy}</a>
    <a href="{support}"{support_current}>{nav_support}</a>
    <a class="wide" href="https://github.com/MohamedAbulgasem/Taqwa">GitHub</a>
  </nav>
</header>
<nav class="wrap langs" aria-label="{languages_label}">
    {language_links}
</nav>

{body}

<footer class="wrap foot">
  <nav aria-label="{footer_label}">
    {prayer_times_footer}<a href="{privacy}">{nav_privacy}</a>
    <a href="{support}">{nav_support}</a>
    <a href="https://github.com/MohamedAbulgasem/Taqwa">GitHub</a>
    <a href="mailto:support@taqwa.world">support@taqwa.world</a>
  </nav>
  <span>{copyright}</span>
</footer>
</body>
</html>
