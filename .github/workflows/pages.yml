name: Website

# Builds taqwa.world and publishes it with GitHub Pages: the pages in site/, the privacy policy
# from PRIVACY.md, and the prayer-time pages, whose times come from the app's own engine
# (tools/timetables compiles the app's prayer, Qibla and Hijri code and runs its tests first).
#
# It runs on every push that touches any of that, and every six hours, so each city's page
# turns over to its new day within a few hours of the city's midnight and to a new month on its
# first. Nothing it generates is committed. The app's own tests live in scripts/test.sh.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "PRIVACY.md"
      - "PRIVACY.*.md"
      - ".github/workflows/pages.yml"
      - "tools/timetables/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      # The app files tools/timetables compiles, tests and reads (see its build.gradle.kts).
      - "shared/src/commonMain/kotlin/world/taqwa/app/prayer/**"
      - "shared/src/commonMain/kotlin/world/taqwa/app/domain/**"
      - "shared/src/commonMain/kotlin/world/taqwa/app/qibla/**"
      - "shared/src/commonMain/kotlin/world/taqwa/app/hijri/**"
      - "shared/src/commonMain/kotlin/world/taqwa/app/i18n/UiLanguage.kt"
      - "shared/src/commonTest/kotlin/world/taqwa/app/prayer/**"
      - "shared/src/commonTest/kotlin/world/taqwa/app/qibla/**"
      - "shared/src/commonTest/kotlin/world/taqwa/app/hijri/**"
      - "widgetcore/src/commonMain/kotlin/world/taqwa/app/domain/**"
      - "shared/src/commonMain/composeResources/values*/strings.xml"
      - "shared/src/commonMain/composeResources/files/cities.csv"
      - "shared/src/commonMain/composeResources/files/city-names-*.csv"
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prayer times from the app's own engine
        # The app's engine, Qibla and Hijri tests run on the JVM first; a change that breaks
        # them, or a city the engine cannot place, stops the build before anything is published.
        run: ./gradlew --no-daemon -p tools/timetables jvmTest generate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # tzdata is deliberately unpinned: the build checks every city's clock against the newest
      # time-zone database and stops if the JDK's copy, which the times were made with, is behind.
      - run: pip install markdown==3.10.3 tzdata
      - run: python3 site/build.py --check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  keepalive:
    # GitHub switches off a public repository's scheduled workflows after sixty days without
    # activity. Enabling the workflow from its own scheduled run resets that clock, so the
    # timetables keep turning over on a quiet repository with nobody touching it.
    if: github.event_name == 'schedule'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
