name: Tests

# The app's own checks on every push and pull request: the shared and widget suites (the domain
# logic, run as Android unit tests on the JVM), a debug build of the Android app, and the
# translation check. The iOS suites need a Mac and still run through scripts/test.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # A pull request from a branch of this repository is already covered by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Android SDK platform 37
        # compileSdk 37 is newer than the runner's image may carry. The package is named
        # android-37.0, not android-37 (docs/BUILD-LOG.md).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Shared and widget tests
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :widgetcore:testDebugUnitTest
      - name: Android app builds
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  strings:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: ./scripts/check-strings.sh
