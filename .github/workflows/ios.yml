name: iOS

# The iOS half of the app's checks, on GitHub's Apple-silicon macOS runner (free for a public
# repository): the Apple Watch's Swift core (iosApp/WatchCore) against the vectors Kotlin commits,
# by swift test on the Mac itself; the shared, widget and watch suites on the iOS simulator, as
# scripts/test.sh runs them on a Mac; then the app built by scripts/ios-build.sh, with its widget
# extension and the Apple Watch app and its widgets inside it, which also holds the extensions to
# their memory budgets and checks the watch bundles (scripts/check-watch-bundle.sh); then the watch
# app, its widgets and its UI tests compiled on their own by scripts/watch-build.sh. Those are the
# CI steps that compile Swift code: swift test the watch's core, and the two builds the rest.
# The watch's UI tests run on the Mac only, never here: CI builds unsigned
# (CODE_SIGNING_ALLOWED=NO), and an unsigned build has no app group, so the app could not store
# the sample feeds the UI tests launch with; and the runner has no watchOS 27 simulator to run
# them on. CI's Xcode 26 compiles the watch targets against the watchOS 26 SDK, which is why the
# watch uses no API newer than watchOS 26 (plan 4's Global Constraints).
# The Android half runs in tests.yml.
#
# Only for changes that can reach the iOS app: the website, the docs and the Android host app
# cannot, and a macOS run takes far longer than the Linux one.
on:
  push:
    paths:
      - "shared/**"
      - "widgetcore/**"
      - "watchcore/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/test.sh"
      - "scripts/ios-build.sh"
      - "scripts/watch-build.sh"
      - "scripts/check-watch-bundle.sh"
      - "scripts/test-watch-bundle-signing.sh"
      - "scripts/xcode.sh"
      - "tools/add-watch-targets.rb"
      - "tools/watch-art.py"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "shared/**"
      - "widgetcore/**"
      - "watchcore/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/test.sh"
      - "scripts/ios-build.sh"
      - "scripts/watch-build.sh"
      - "scripts/check-watch-bundle.sh"
      - "scripts/test-watch-bundle-signing.sh"
      - "scripts/xcode.sh"
      - "tools/add-watch-targets.rb"
      - "tools/watch-art.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # A pull request from a branch of this repository is already covered by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # macOS 26 on Apple silicon: its Xcode is always a 26.x, which Kotlin 2.4's CoreLocation
    # bindings need (docs/BUILD-LOG.md), and the app builds for Apple-silicon simulators only.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Xcode
        # The image's default Xcode, named in DEVELOPER_DIR so every step uses the same one;
        # scripts/xcode.sh refuses anything older than Xcode 26.
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Kotlin/Native toolchain cache
        # The compiler, its LLVM and the library caches it builds on first use: minutes a run.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: The Apple Watch's Swift core against the vectors
        # scripts/test.sh runs this first when it is given no tasks; this job names its tasks, so
        # the step is its own. On the Mac itself, with no simulator: the vectors Kotlin commits.
        run: swift test --package-path iosApp/WatchCore
      - name: Shared, widget and watch tests on the iOS simulator
        run: ./scripts/test.sh --no-daemon :shared:iosSimulatorArm64Test :widgetcore:iosSimulatorArm64Test :watchcore:iosSimulatorArm64Test
      - name: watchOS platform
        # Since Xcode 15 a simulator build can need its platform installed, and the iPhone build
        # now compiles the watch app: install the watchOS platform when the image lacks it.
        run: |
          xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS
          xcrun simctl list runtimes
      - name: The app, its widget and the watch app build, and the extensions stay under their memory budgets
        # Unsigned: a simulator build needs no team, and this machine has none to sign with. The
        # bundle check prints "rule 4b skipped: unsigned or ad hoc": the signed entitlements are
        # plan 5's archive and export checks (scripts/ios-release.sh), whose rules
        # scripts/test-watch-bundle-signing.sh, run by ios-build.sh, tests with a stub signature.
        run: |
          ./scripts/ios-build.sh build CODE_SIGNING_ALLOWED=NO
          # The script skips the size check when there is no extension to measure; here there must be one.
          test -d build/ios-dd/Build/Products/Debug-iphonesimulator/Taqwa.app/PlugIns/TaqwaWidget.appex
          test -d build/ios-dd/Build/Products/Debug-iphonesimulator/Taqwa.app/Watch/TaqwaWatch.app
      - name: The watch app, its widgets and its UI tests compile
        # A generic destination names no watch device or OS, so the image's watchOS 26 serves. The
        # UI tests only compile here; they run on the Mac (the header says why).
        run: WATCH_DEST="generic/platform=watchOS Simulator" ./scripts/watch-build.sh build-for-testing CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
