# The weekly monitor in the cloud (docs/MONITOR.md, ruling R94). This file belongs in the PRIVATE
# archive repository (MohamedAbulgasem/Taqwa-official) as .github/workflows/monitor-weekly.yml; the
# public Taqwa repository only keeps this template. That repository holds the restricted archive
# (archive/) and the monitor's state (monitor/) at its root, the layout TAQWA_OFFICIAL names.
#
# Each run checks out the archive repository at the root and the public Taqwa repository at main
# into taqwa/, runs scripts/monitor.sh, commits and pushes whatever the run added or changed under
# archive/ and monitor/ (nothing else), and keeps one issue "Taqwa monitor" (label
# monitor-attention) open while something needs attention: created or updated only when the
# attention set changed (always when the monitor itself failed), closed with a one-line comment when
# a run is green. The job itself fails only when the monitor itself failed (exit 2).
#
# No secret is ever echoed: the one optional secret, LPT_API_KEY (London Prayer Times), reaches the
# fetcher through the environment alone, and every URL the monitor writes is masked.
name: Taqwa monitor

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      options:
        description: "Options for scripts/monitor.sh, for example --no-fetch --check-all, or --only sa-ummalqura"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: taqwa-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      TAQWA_OFFICIAL: ${{ github.workspace }}
    steps:
      - name: Check out the archive (this repository)
        uses: actions/checkout@v4

      - name: Check out Taqwa at main
        uses: actions/checkout@v4
        with:
          repository: MohamedAbulgasem/Taqwa
          ref: main
          path: taqwa

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the monitor
        id: run
        env:
          LPT_API_KEY: ${{ secrets.LPT_API_KEY }}
        run: |
          set +e
          taqwa/scripts/monitor.sh --verbose ${{ github.event.inputs.options }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "The monitor exited $code"

      - name: Commit what the run added or changed
        if: always()
        run: |
          git config user.name "taqwa-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf monitor/lock
          git add -A archive monitor
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -q -m "Monitor: run of $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open, update or close the issue
        if: always()
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.run.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const code = Number(process.env.CODE || '2');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            let last = {};
            try {
              last = JSON.parse(fs.readFileSync('monitor/last-run.json', 'utf8'));
            } catch (e) {
              last = { date: new Date().toISOString().slice(0, 10), summary: 'The monitor wrote no result; see the workflow log.', attentionChanged: true, issue: '' };
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: 'monitor-attention', per_page: 10 });
            const existing = open.find(i => i.title === 'Taqwa monitor');
            if (code === 0) {
              if (existing) {
                await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body: `All green on ${last.date}; closed (${runUrl}).` });
                await github.rest.issues.update({ ...repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            const changed = code === 2 || last.attentionChanged === true || !existing;
            if (!changed) {
              core.info('The attention set is as last notified; the issue stands as it is.');
              return;
            }
            const body = `${last.issue || last.summary || ''}\n\nRun: ${runUrl}`;
            if (existing) {
              await github.rest.issues.update({ ...repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body: `Updated on ${last.date}: ${last.summary}` });
            } else {
              try {
                await github.rest.issues.getLabel({ ...repo, name: 'monitor-attention' });
              } catch (e) {
                await github.rest.issues.createLabel({ ...repo, name: 'monitor-attention', color: 'B60205', description: 'The weekly timetable monitor needs attention' });
              }
              await github.rest.issues.create({ ...repo, title: 'Taqwa monitor', body, labels: ['monitor-attention'] });
            }

      - name: Fail the job when the monitor itself failed
        if: always() && steps.run.outputs.code == '2'
        run: exit 1
