# The weekly monitor in the cloud (docs/MONITOR.md, ruling R94). This file belongs in the PRIVATE
# archive repository (MohamedAbulgasem/Taqwa-official) as .github/workflows/monitor-weekly.yml; the
# public Taqwa repository only keeps this template, and a run says when the two differ. That
# repository holds the restricted archive (archive/) and the monitor's state (monitor/) at its root,
# the layout TAQWA_OFFICIAL names.
#
# It runs on Mondays and on the 1st of each month, after midnight in Cape Town: the MJC's page shows
# the current month alone and drops it when the next begins (a month-start source in sources.tsv).
# The run on the 1st is a normal full run: whatever is due is fetched, and the issue follows the same
# rules; when the 1st is a Monday the second run waits for the first and finds nothing new due.
#
# Each run checks out the archive repository at its branch's head and the public Taqwa repository
# at main into taqwa/ (neither checkout keeps a token; the commit step alone is given one), runs
# scripts/monitor.sh, commits and pushes whatever the run added or changed under archive/ and
# monitor/ (nothing else; rebased onto what arrived meanwhile, retried once, and kept as an artifact
# when the push still fails), and keeps one issue "Taqwa monitor" (label monitor-attention) open
# while something needs attention: created or updated only when the attention set changed (always
# when the monitor itself failed), its body rewritten from the report with a "Recovered" comment on
# the first sound full run after a failure, closed with a one-line comment when a full run is green
# (a green run never opens one). A partial run (--only) adds a comment at most, whether it succeeded
# or failed. Refused dispatch options stop the job before anything runs, and nothing else is touched.
# The job fails when the monitor itself failed: an exit other than 0 or 1, a result record missing
# or older than the run's start, or a push that could not land.
#
# After a full run that is green or needs attention (never a partial run, never when the monitor itself
# failed), scripts/prove.sh turns the new captures into proof (docs/MONITOR.md, "Prove"): pinned copies,
# the recipes' rows, the whole gate green, the stamps, ProofStamps.kt, the golden vector byte-identical and
# every check; the pinned copies are committed here with the run's other changes, and only then, when
# prove changed the public checkout, the change is pushed to MohamedAbulgasem/Taqwa main with the secret
# TAQWA_PUSH_TOKEN (skipped with a notice while it is not set). The issue gains a "Proof" section.
#
# No secret is ever echoed: LPT_API_KEY (London Prayer Times, optional) reaches the fetcher through the
# environment alone, TAQWA_PUSH_TOKEN reaches git as a masked HTTP header in the push step alone, and
# every URL and message the monitor writes is masked.
# Every action is pinned by commit (its version beside it, as the public workflows do).
name: Taqwa monitor

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
    - cron: "17 3 1 * *" # the 1st of each month, 03:17 UTC (two hours later in Cape Town): the MJC's new month
  workflow_dispatch:
    inputs:
      options:
        description: "Options for scripts/monitor.sh: --no-fetch, --check-all, --verbose, --only <a source id of sources.tsv> (a partial run)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: taqwa-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      TAQWA_OFFICIAL: ${{ github.workspace }}
      BRANCH: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the archive at the branch's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Check out Taqwa at main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MohamedAbulgasem/Taqwa
          ref: main
          path: taqwa
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            taqwa/gradle/libs.versions.toml
            taqwa/gradle/wrapper/gradle-wrapper.properties
            taqwa/tools/timetables/*.gradle.kts

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the options
        id: options
        env:
          OPTIONS: ${{ github.event.inputs.options }}
        run: |
          # Only --no-fetch, --check-all, --verbose and --only <a source id listed in sources.tsv> pass;
          # anything else stops the job before the monitor runs. The words are split with globbing off
          # and never reach a shell unquoted; the catalogue's comment and header lines are no source.
          set -euo pipefail
          set -f
          args=()
          partial=false
          expect_source=false
          ids="$(awk -F'\t' '/^#/ {next} !seen {seen=1; next} {print $1}' taqwa/tools/timetables/official/monitor/sources.tsv)"
          for word in $OPTIONS; do
            if [ "$expect_source" = true ]; then
              if [[ "$word" =~ ^[a-z0-9-]+$ ]] && printf '%s\n' "$ids" | grep -qx -- "$word"; then
                args+=(--only "$word")
                partial=true
                expect_source=false
                continue
              fi
              echo "::error::'$word' is not a source id of sources.tsv"
              exit 1
            fi
            case "$word" in
              --no-fetch|--check-all|--verbose) args+=("$word") ;;
              --only) expect_source=true ;;
              *) echo "::error::option '$word' is not allowed here"; exit 1 ;;
            esac
          done
          if [ "$expect_source" = true ]; then echo "::error::--only needs a source id"; exit 1; fi
          : > .monitor-args
          for a in ${args[@]+"${args[@]}"}; do printf '%s\n' "$a" >> .monitor-args; done
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          echo "Options: ${args[*]:-none}"

      - name: Run the monitor
        id: run
        env:
          LPT_API_KEY: ${{ secrets.LPT_API_KEY }}
        run: |
          set +e
          rm -f monitor/last-run.json
          start=$(date +%s)
          echo "start=$start" >> "$GITHUB_OUTPUT"
          args=()
          while IFS= read -r line; do [ -n "$line" ] && args+=("$line"); done < .monitor-args
          rm -f .monitor-args
          taqwa/scripts/monitor.sh --verbose ${args[@]+"${args[@]}"}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "The monitor exited $code"

      - name: Read the result
        id: result
        if: always() && steps.options.outcome == 'success'
        env:
          CODE: ${{ steps.run.outputs.code }}
          START: ${{ steps.run.outputs.start }}
          PARTIAL: ${{ steps.options.outputs.partial }}
        run: |
          # The record counts only when it is this run's: present, written after the run started, and
          # its code 0 or 1. Anything else is "the monitor itself failed". Writes issue-body.md (at most
          # 60,000 characters, ending with a pointer to the run's files) and the step summary. Whether
          # the run was partial comes from the checked options, never from a record.
          python3 - <<'PY'
          import json, os, time
          code = os.environ.get("CODE") or ""
          start_text = os.environ.get("START") or ""
          partial = os.environ.get("PARTIAL") == "true"
          path = "monitor/last-run.json"
          record, fresh, stale = {}, False, False
          if start_text and os.path.isfile(path):
              if int(os.stat(path).st_mtime) >= int(start_text) - 1:
                  try:
                      record = json.load(open(path, encoding="utf-8"))
                      fresh = True
                  except ValueError:
                      record = {}
              else:
                  stale = True
          date = record.get("date") or time.strftime("%Y-%m-%d", time.gmtime())
          valid = fresh and code in ("0", "1") and str(record.get("exit")) == code
          marker = "<!-- monitor-failed -->"
          if valid:
              body = record.get("issue") or ""
              summary = record.get("summary") or ""
          else:
              if not start_text:
                  reason = "the run step did not run"
              elif fresh and str(record.get("exit")) == "2":
                  reason = record.get("summary") or "no reason recorded"
              elif fresh:
                  reason = "the run exited %s but its record says %s" % (code or "?", record.get("exit"))
              elif stale:
                  reason = "the run exited %s and left a result record older than this run" % (code or "?")
              else:
                  reason = "the run exited %s and wrote no result record (see the workflow log)" % (code or "?")
              summary = reason if reason.startswith("The monitor itself failed") else "The monitor itself failed: " + reason
              # A failure record that still carries the check's own list (the fetch driver broke, the check ran) keeps it.
              kept = (record.get("issue") or "") if fresh and str(record.get("exit")) == "2" else ""
              body = marker + "\n" + (kept if kept.startswith("**Taqwa monitor") else "**Taqwa monitor, %s.** %s\n" % (date, summary))
              body = body.rstrip("\n") + ("\n\nThe run's log is `monitor/fetch/run-%s.log` in the archive repository, its report (when the check ran) "
                                          "`monitor/reports/%s.md`, and the last full report `monitor/latest.md`.\n") % (date, date)
          pointer = "\nThe full report is `monitor/latest.md` in the archive repository (restricted: it quotes dates, counts and minutes).\n"
          limit = 60000
          if len(body) + len(pointer) > limit:
              body = body[: limit - len(pointer) - 40].rsplit("\n", 1)[0] + "\n… (cut: the rest is in the report)\n"
          if valid and not body.rstrip().endswith("minutes)."):
              body = body.rstrip("\n") + "\n" + pointer
          with open("issue-body.md", "w", encoding="utf-8") as f:
              f.write(body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(("Partial run.\n\n" if partial else "") + body[:limit])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("valid=%s\n" % str(valid).lower())
              f.write("changed=%s\n" % str(bool(record.get("attentionChanged"))).lower())
              f.write("date=%s\n" % date)
              f.write("summary=%s\n" % summary.replace("\n", " ")[:900])
          print("valid" if valid else "not valid", "-", summary[:300])
          PY

      - name: Prove the new captures
        id: prove
        # Only after a FULL run whose record is sound and green or attention (never a partial run, never when the
        # monitor itself failed). scripts/prove.sh pins each new capture under archive/ (committed by the next step),
        # appends its recipe's rows, runs the whole gate (a failing new row is removed and reported, never loosened),
        # and runs every check (ProofStamps.kt, the golden vector byte-identical, checkStamps, the tools' tests, the
        # generator, the site's checks); on any failure it puts everything back. No token reaches this step.
        if: always() && steps.options.outcome == 'success' && steps.options.outputs.partial != 'true' && steps.result.outputs.valid == 'true' && (steps.run.outputs.code == '0' || steps.run.outputs.code == '1')
        env:
          RUN_DATE: ${{ steps.result.outputs.date }}
          PROVE_OUT: ${{ github.workspace }}/monitor/proof
        run: |
          set +e
          rm -rf monitor/proof
          # The site's checks need what the public Pages workflow installs (tzdata unpinned there too: the newest zones).
          python3 -m pip install --quiet markdown==3.10.3 tzdata
          taqwa/scripts/prove.sh --date "$RUN_DATE"
          code=$?
          changed="$(cat monitor/proof/changed 2>/dev/null || echo false)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Prove exited $code (public change: $changed)"
          exit 0

      - name: Commit what the run added or changed
        id: commit
        if: always() && steps.options.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Only archive/ and monitor/, rebased onto whatever arrived meanwhile (a run by hand, a queued
          # run), one retry; when the push still fails the changes are kept as an artifact and the job
          # fails. The token is given to this step alone, on the remote URL.
          set -uo pipefail
          git config user.name "taqwa-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf monitor/lock
          git add -A archive monitor
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -q -m "Monitor: run of $(date -u +%Y-%m-%d)"
          git diff -z --name-only --diff-filter=d HEAD~1 HEAD -- archive monitor > changed-files.z
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2; do
            if git pull --rebase "$remote" "$BRANCH" && git push "$remote" "HEAD:$BRANCH"; then
              echo "Pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "The push did not land (attempt $attempt)"
            sleep 20
          done
          tar --null -T changed-files.z -czf monitor-run-changes.tgz
          echo "::error::the push was rejected twice; this run's changes are kept as the artifact monitor-run-changes"
          echo "pushfailed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the changes when the push failed
        if: always() && steps.commit.outputs.pushfailed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-run-changes-${{ github.run_id }}
          path: monitor-run-changes.tgz
          retention-days: 90

      - name: Push the proof to Taqwa's main
        id: publish
        # Only when prove changed the public checkout with every check green AND this run's archive commit (the
        # pinned copies the new rows read) landed. The token (TAQWA_PUSH_TOKEN, a fine-grained token with Contents:
        # write on MohamedAbulgasem/Taqwa alone) is given to this step only, reaches git as an HTTP header for the
        # two commands that need it, is masked, and is never echoed nor put in a URL. Without the secret the step
        # skips with a notice. A rejected push is rebased onto main and retried once, after checkStamps passes on
        # the rebased tree (no archive needed); otherwise nothing is pushed and the job fails.
        if: always() && steps.prove.outputs.code == '0' && steps.prove.outputs.changed == 'true' && steps.commit.outcome == 'success' && steps.commit.outputs.pushfailed != 'true'
        env:
          TAQWA_PUSH_TOKEN: ${{ secrets.TAQWA_PUSH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TAQWA_PUSH_TOKEN:-}" ]; then
            echo "::notice::TAQWA_PUSH_TOKEN is not set: the proof was checked but not pushed to Taqwa (add the secret, docs/MONITOR.md)"
            echo "state=not pushed: the secret TAQWA_PUSH_TOKEN is not set" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          basic="$(printf 'x-access-token:%s' "$TAQWA_PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $basic"
          remote="https://github.com/MohamedAbulgasem/Taqwa.git"
          cd taqwa
          git config user.name "taqwa-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/timetables/official/gate tools/timetables/official/stamps shared/src/commonMain/kotlin/world/taqwa/app/prayer/engine/registry/data/ProofStamps.kt
          if git diff --cached --quiet; then
            echo "state=nothing to push" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/timetables/monitor/proof.py message "$GITHUB_WORKSPACE/monitor/proof" > "$RUNNER_TEMP/proof-message.txt" || exit 1
          git commit -q -F "$RUNNER_TEMP/proof-message.txt" || exit 1
          for attempt in 1 2; do
            if git -c "$header" push -q "$remote" HEAD:main; then
              echo "state=pushed to main ($(git rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"
              echo "Pushed $(git rev-parse --short HEAD) to Taqwa main"
              exit 0
            fi
            [ "$attempt" = 2 ] && break
            echo "The push was rejected; rebasing onto main once"
            if ! git -c "$header" pull -q --rebase "$remote" main; then
              git rebase --abort 2>/dev/null || true
              break
            fi
            if ! ./gradlew --no-daemon -q -p tools/timetables checkStamps; then
              echo "::error::after the rebase onto main the stamps no longer check (main changed the engine or the stamps): not pushed"
              break
            fi
          done
          echo "state=not pushed: the push to Taqwa main was rejected twice" >> "$GITHUB_OUTPUT"
          echo "pushfailed=true" >> "$GITHUB_OUTPUT"
          echo "::error::the proof could not be pushed to Taqwa main; it is in monitor/proof/ and the pinned copies are committed"

      - name: Write the proof section
        if: always() && steps.options.outcome == 'success' && steps.options.outputs.partial != 'true'
        env:
          PUSHED: ${{ steps.publish.outputs.state }}
          PROVE_CODE: ${{ steps.prove.outputs.code }}
        run: |
          # The issue body (restricted repository) gains "## Proof": rows added, rows left out with the reason, cities
          # newly proven (the generator's notices before and after), and whether the public push landed.
          state="$PUSHED"
          if [ -z "$state" ] && [ "$PROVE_CODE" = 1 ]; then state="not pushed: a check failed after rows were added, everything was put back (see the log)"; fi
          if [ -z "$state" ] && [ "$PROVE_CODE" = 0 ]; then state="nothing to push"; fi
          python3 taqwa/tools/timetables/monitor/proof.py section monitor/proof --pushed "${state:-not run}" > proof-section.md || echo "## Proof" > proof-section.md
          if [ -f issue-body.md ]; then printf '\n' >> issue-body.md && cat proof-section.md >> issue-body.md; fi
          cat proof-section.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        if: always() && steps.options.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.run.outputs.code }}
          VALID: ${{ steps.result.outputs.valid }}
          PARTIAL: ${{ steps.options.outputs.partial }}
          CHANGED: ${{ steps.result.outputs.changed }}
          RUN_DATE: ${{ steps.result.outputs.date }}
          SUMMARY: ${{ steps.result.outputs.summary }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --label monitor-attention --limit 20 --json number,title --jq '[.[] | select(.title == "Taqwa monitor")][0].number // empty')"
          failed=true
          if [ "$VALID" = true ] && { [ "$CODE" = 0 ] || [ "$CODE" = 1 ]; }; then failed=false; fi
          if [ "$PARTIAL" = true ]; then
            # A partial run, sound or failed, never closes, opens or rewrites the issue (ruling N1): a comment at most.
            if [ -n "$number" ]; then gh issue comment "$number" --body "Partial run on $RUN_DATE ($RUN_URL): $SUMMARY"; fi
            echo "Partial run: the issue stands as it is"
            exit 0
          fi
          if [ "$failed" = false ] && [ "$CODE" = 0 ]; then
            # A green week closes an open issue and never opens one.
            if [ -n "$number" ]; then gh issue close "$number" --comment "All green on $RUN_DATE; closed ($RUN_URL)."; fi
            echo "All green"
            exit 0
          fi
          recovered=false
          if [ "$failed" = false ] && [ -n "$number" ] && gh issue view "$number" --json body --jq .body | grep -q -- '<!-- monitor-failed -->'; then
            # The first sound full run after a failure: the body is rewritten from the report whatever the set did.
            recovered=true
          fi
          if [ "$failed" = false ] && [ "$recovered" = false ] && [ "$CHANGED" != true ] && [ -n "$number" ]; then
            echo "The attention set is as last notified; the issue stands as it is"
            exit 0
          fi
          printf '\n\nRun: %s\n' "$RUN_URL" >> issue-body.md
          gh label create monitor-attention --color B60205 --description "The weekly timetable monitor needs attention" --force >/dev/null 2>&1 || true
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md >/dev/null
            if [ "$recovered" = true ]; then
              gh issue comment "$number" --body "Recovered on $RUN_DATE ($RUN_URL): $SUMMARY"
              echo "Recovered: issue #$number rewritten from the report"
            else
              gh issue comment "$number" --body "Updated on $RUN_DATE ($RUN_URL): $SUMMARY"
              echo "Updated issue #$number"
            fi
          else
            gh issue create --title "Taqwa monitor" --label monitor-attention --body-file issue-body.md
            echo "Opened the issue"
          fi

      - name: Fail the job when the options were refused, the monitor itself failed, its changes did not land, or prove failed
        if: always() && (steps.options.outcome != 'success' || steps.result.outputs.valid != 'true' || steps.commit.outputs.pushfailed == 'true' || (steps.prove.outputs.code != '' && steps.prove.outputs.code != '0') || steps.publish.outputs.pushfailed == 'true')
        run: |
          if [ "${{ steps.options.outcome }}" != "success" ]; then
            echo "::error::the dispatch options were refused (see the 'Check the options' step); nothing ran and nothing was touched"
          elif [ "${{ steps.result.outputs.valid }}" != "true" ] || [ "${{ steps.commit.outputs.pushfailed }}" = "true" ]; then
            echo "::error::the monitor itself failed (exit ${{ steps.run.outputs.code }}, result valid: ${{ steps.result.outputs.valid }}, push failed: ${{ steps.commit.outputs.pushfailed }})"
          else
            echo "::error::prove did not publish (prove exit ${{ steps.prove.outputs.code }}, Taqwa push failed: ${{ steps.publish.outputs.pushfailed }}); the issue's Proof section says why"
          fi
          exit 1
