// The Compose compiler's stability configuration for :shared (Ruling 45).
//
// Plan 3 Task 1 moved the tasbeeh rules to :watchcore, so that both watches count with the phone's
// own code. :watchcore is not compiled with the Compose compiler, so it infers nothing about them,
// and TasbeehUiState and the tasbeeh screen's parameters lost the stability they had while the
// classes lived here. Every class in the package is immutable (data classes of vals, sealed data
// objects and stateless objects), so they are declared stable, as they inferred before the move.
// A class added to the package must be immutable too, or be kept out of this list.
world.taqwa.app.tasbeeh.*
