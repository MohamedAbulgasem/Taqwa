#Gradle
# adhan2 0.0.7's JVM artifact is compiled to Java 21 class files (major 65), which a
# JDK 17 toolchain cannot load. Android Studio bundles a JDK 21, so we use it rather
# than requiring a separate install.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=false

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 made 'com.android.library'/'com.android.application' incompatible with the
# Kotlin Multiplatform plugin. Google documents these two flags as the supported bypass.
# The alternative is migrating 'shared' to 'com.android.kotlin.multiplatform.library',
# which is a DSL rewrite; revisit when the app is otherwise stable.
android.builtInKotlin=false
android.newDsl=false
