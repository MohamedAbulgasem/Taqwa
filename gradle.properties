#Gradle
# adhan2 0.0.7's JVM artifact is compiled to Java 21 class files (major 65), which a JDK 17
# toolchain cannot load. Every module declares `jvmToolchain(21)`, so compilation and tests run
# on a JDK 21 whatever JDK Gradle itself was started with: a local one if Gradle finds it, else
# one fetched by the foojay resolver (settings.gradle.kts). No machine-specific path belongs here;
# to pin Gradle's own JDK, set org.gradle.java.home in ~/.gradle/gradle.properties instead.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=false

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 made 'com.android.library'/'com.android.application' incompatible with the
# Kotlin Multiplatform plugin. Google documents these two flags as the supported bypass.
# The alternative is migrating 'shared' to 'com.android.kotlin.multiplatform.library',
# which is a DSL rewrite; revisit when the app is otherwise stable.
android.builtInKotlin=false
android.newDsl=false
